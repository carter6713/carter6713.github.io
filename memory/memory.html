<title>记忆 - 6+7</title>
<style type="text/css">
html {
	overflow:hidden;
	-ms-touch-action:none;
	-ms-content-zooming:none;
}
body {
	position:absolute;
	margin:0px;
	padding:0px;
	background:#fff;
	width:100%;
	height:100%;
}
#canvas {
	position:absolute;
	width:100%;
	height:100%;
	background:#fff;
}

/* ---------- 页面标题 ---------- */

.memory-heading {
	position: fixed;
	top: 20px;
	left: 50%;
	transform: translateX(-50%);
	z-index: 9998;

	color: #3f3f3f;
	text-align: center;
	font-family:
		-apple-system,
		BlinkMacSystemFont,
		"Segoe UI",
		"Microsoft YaHei",
		sans-serif;

	pointer-events: none;
	transition:
		opacity 0.3s ease,
		visibility 0s linear 0s;
}

.memory-heading--hidden {
	opacity: 0;
	visibility: hidden;
	transition:
		opacity 0.3s ease,
		visibility 0s linear 0.3s;
}

.memory-heading__title {
	min-height: 32px;
	font-size: 26px;
	font-weight: 300;
	letter-spacing: 9px;
	line-height: 1.2;
	white-space: nowrap;
}

.memory-heading__subtitle {
	min-height: 17px;
	margin-top: 7px;
	color: rgba(60, 80, 95, 0.55);
	font-size: 12px;
	font-weight: 300;
	letter-spacing: 2.5px;
	line-height: 1.4;
	white-space: nowrap;
}

.memory-heading__cursor {
	display: inline-block;
	margin-left: 2px;
	color: #537491;
	font-weight: 200;
	letter-spacing: 0;
	animation: memory-cursor-blink 0.85s steps(1, end) infinite;
	transition: opacity 0.45s ease;
}

.memory-heading__cursor--hidden {
	animation: none;
	opacity: 0;
}

@keyframes memory-cursor-blink {
	0%, 48% { opacity: 1; }
	49%, 100% { opacity: 0; }
}

/* ---------- 照片说明 ---------- */

.memory-caption {
	position: fixed;
	left: 50%;
	bottom: 28px;
	z-index: 9997;

	box-sizing: border-box;
	width: calc(100vw - 40px);
	max-width: 520px;
	padding: 17px 24px 19px;

	color: #555;
	text-align: center;
	font-family:
		-apple-system,
		BlinkMacSystemFont,
		"Segoe UI",
		"Microsoft YaHei",
		sans-serif;

	background: rgba(255, 255, 255, 0.72);
	-webkit-backdrop-filter: blur(8px);
	backdrop-filter: blur(8px);
	border: 1px solid rgba(50, 70, 90, 0.10);
	border-radius: 12px;
	box-shadow: 0 12px 35px rgba(30, 50, 70, 0.08);

	opacity: 0;
	visibility: hidden;
	filter: blur(4px);
	transform: translate(-50%, 14px) scale(0.985);
	pointer-events: none;

	transition:
		opacity 0.3s ease,
		transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
		filter 0.3s ease,
		visibility 0s linear 0.35s;
}

.memory-caption--visible {
	opacity: 1;
	visibility: visible;
	filter: blur(0);
	transform: translate(-50%, 0) scale(1);
	transition:
		opacity 0.45s ease,
		transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
		filter 0.45s ease,
		visibility 0s linear 0s;
}

.memory-caption__accent {
	width: 28px;
	height: 1px;
	margin: 0 auto 10px;
	background: #537491;
	opacity: 0.55;
}

.memory-caption__item {
	opacity: 0;
	transform: translateY(5px);
	transition:
		opacity 0.28s ease,
		transform 0.38s cubic-bezier(0.22, 0.61, 0.36, 1);
}

.memory-caption--visible .memory-caption__meta {
	opacity: 1;
	transform: translateY(0);
	transition-delay: 0.08s;
}

.memory-caption--visible .memory-caption__title {
	opacity: 1;
	transform: translateY(0);
	transition-delay: 0.16s;
}

.memory-caption--visible .memory-caption__text {
	opacity: 1;
	transform: translateY(0);
	transition-delay: 0.24s;
}

.memory-caption__meta {
	color: rgba(83, 116, 145, 0.72);
	font-size: 11px;
	font-weight: 300;
	letter-spacing: 1.8px;
	line-height: 1.5;
}

.memory-caption__separator {
	display: inline-block;
	width: 2px;
	height: 2px;
	margin: 0 8px;
	vertical-align: middle;
	background: #537491;
	border-radius: 50%;
	opacity: 0.62;
}

.memory-caption__title {
	margin-top: 8px;
	color: #444;
	font-size: 20px;
	font-weight: 300;
	letter-spacing: 4px;
	line-height: 1.4;
}

.memory-caption__text {
	margin-top: 7px;
	color: rgba(68, 68, 68, 0.76);
	font-size: 13px;
	font-weight: 300;
	letter-spacing: 1px;
	line-height: 1.8;
}

/* ---------- 聚焦照片导航 ---------- */

.memory-navigation {
	position: fixed;
	inset: 0;
	z-index: 9998;

	visibility: hidden;
	pointer-events: none;
	transition: visibility 0s linear 0.35s;
}

.memory-navigation--visible {
	visibility: visible;
	transition-delay: 0s;
}

.memory-navigation__button {
	position: fixed;
	top: 50%;
	box-sizing: border-box;
	width: 64px;
	height: 72px;
	padding: 0;

	color: rgba(255, 255, 255, 0.88);
	background: transparent;
	border: 0;
	box-shadow: none;

	opacity: 0;
	transform: translateY(-50%) scale(0.96);
	visibility: hidden;
	pointer-events: none;
	cursor: pointer;

	transition:
		opacity 0.35s ease,
		transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
		visibility 0s linear 0.35s;
}

.memory-navigation__button--prev {
	left: 8vw;
}

.memory-navigation__button--next {
	right: 8vw;
}

.memory-navigation--visible .memory-navigation__button {
	opacity: 0.78;
	transform: translateY(-50%) scale(1);
	visibility: visible;
	pointer-events: auto;
	transition-delay: 0s;
}

.memory-navigation--idle .memory-navigation__button {
	opacity: 0.26;
	transform: translateY(-50%) scale(0.96);
}

.memory-navigation--visible .memory-navigation__button--prev:hover,
.memory-navigation--visible .memory-navigation__button--prev:focus-visible {
	opacity: 0.96;
	transform: translate(-3px, -50%) scale(1.04);
}

.memory-navigation--visible .memory-navigation__button--next:hover,
.memory-navigation--visible .memory-navigation__button--next:focus-visible {
	opacity: 0.96;
	transform: translate(3px, -50%) scale(1.04);
}

.memory-navigation__button:focus {
	outline: none;
}

.memory-navigation__button:focus-visible {
	outline: 1px solid rgba(83, 116, 145, 0.72);
	outline-offset: 4px;
}

.memory-navigation__icon {
	display: block;
	width: 30px;
	height: 40px;
	margin: auto;
	overflow: visible;
}

.memory-navigation__glass-bar {
	stroke: rgba(255, 255, 255, 0.48);
	stroke-width: 0.65;
	filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.28));
	transition:
		stroke 0.4s ease,
		filter 0.4s ease;
}

.memory-navigation__button:hover .memory-navigation__glass-bar,
.memory-navigation__button:focus-visible .memory-navigation__glass-bar {
	stroke: rgba(255, 255, 255, 0.72);
	filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.32));
}

@media (max-width: 700px) {
	.memory-caption {
		bottom: max(18px, env(safe-area-inset-bottom));
		width: calc(100vw - 32px);
		padding: 14px 18px 16px;
	}

	.memory-caption__title {
		font-size: 18px;
	}

	.memory-caption__text {
		font-size: 12px;
	}

	.memory-navigation__button {
		width: 52px;
		height: 60px;
	}

	.memory-navigation__button--prev {
		left: 14px;
	}

	.memory-navigation__button--next {
		right: 14px;
	}
}

/* ---------- 返回主页 ---------- */

.back-home {
	position: fixed;
	top: 24px;
	left: 24px;

	z-index: 9999;

	padding: 9px 16px;

	color: #333;
	text-decoration: none;

	font-family:
		-apple-system,
		BlinkMacSystemFont,
		"Segoe UI",
		"Microsoft YaHei",
		sans-serif;

	font-size: 14px;

	background: rgba(255, 255, 255, 0.88);

	border: 1px solid rgba(0, 0, 0, 0.18);
	border-radius: 20px;

	transition:
		background 0.25s ease,
		transform 0.25s ease;
}

.back-home:hover {
	background: #fff;
	transform: translateY(-2px);
}
</style>

<script type="text/javascript" src="memories.js"></script>
<script type="text/javascript" src="js/ge1doot.js"></script>
<script type="text/javascript">

"use strict";

var GALLERY_PHOTO_SPACING = 1000;
var GALLERY_EDGE_MARGIN = 500;
var GALLERY_MIN_RADIUS = 1500;

function calculateWallCounts(memoryCount) {
	var base = Math.floor(memoryCount / 4);
	var remainder = memoryCount % 4;
	var counts = [];

	for (var i = 0; i < 4; i++) {
		counts.push(base + (i < remainder ? 1 : 0));
	}
	return counts;
}

function generateWallOffsets(count, spacing) {
	var offsets = [];
	for (var i = 0; i < count; i++) {
		offsets.push((i - (count - 1) / 2) * spacing);
	}
	return offsets;
}

function calculateGalleryRadius(wallCounts) {
	var maxPerWall = Math.max.apply(Math, wallCounts);
	var halfSpan = Math.max(0, (maxPerWall - 1) / 2 * GALLERY_PHOTO_SPACING);
	return Math.max(GALLERY_MIN_RADIUS, halfSpan + GALLERY_EDGE_MARGIN);
}

function generateGalleryPositions(memoryCount) {
	var wallCounts = calculateWallCounts(memoryCount);
	var galleryRadius = calculateGalleryRadius(wallCounts);
	var positions = [];
	var offsets;
	var i;

	// North: left to right.
	offsets = generateWallOffsets(wallCounts[0], GALLERY_PHOTO_SPACING);
	for (i = 0; i < offsets.length; i++) {
		positions.push({x:offsets[i], y:0, z:galleryRadius, nx:0, nz:1});
	}

	// East: north to south.
	offsets = generateWallOffsets(wallCounts[1], GALLERY_PHOTO_SPACING);
	for (i = 0; i < offsets.length; i++) {
		positions.push({x:galleryRadius, y:0, z:-offsets[i], nx:-1, nz:0});
	}

	// South: east to west.
	offsets = generateWallOffsets(wallCounts[2], GALLERY_PHOTO_SPACING);
	for (i = 0; i < offsets.length; i++) {
		positions.push({x:-offsets[i], y:0, z:-galleryRadius, nx:0, nz:-1});
	}

	// West: south to north.
	offsets = generateWallOffsets(wallCounts[3], GALLERY_PHOTO_SPACING);
	for (i = 0; i < offsets.length; i++) {
		positions.push({x:-galleryRadius, y:0, z:offsets[i], nx:1, nz:0});
	}

	return positions;
}

function buildGalleryImageData(memories, positions) {
	var imageData = [];
	for (var i = 0; i < memories.length; i++) {
		var memory = memories[i];
		var position = positions[i];
		imageData.push({
			img: memory.image,
			x: position.x,
			y: position.y,
			z: position.z,
			nx: position.nx,
			nz: position.nz,
			memory: memory
		});
	}
	return imageData;
}

var memoryImageData = (function () {
	var memories = window.MEMORIES;
	var validMemories = [];

	if (!Array.isArray(memories)) {
		console.error("MEMORIES 数据不存在或格式错误：应为数组。");
		return [];
	}
	for (var i = 0; i < memories.length; i++) {
		var memory = memories[i];
		if (!memory || typeof memory !== "object" || typeof memory.image !== "string" || !memory.image) {
			console.error("MEMORIES[" + i + "] 格式错误：缺少有效的 image。");
			continue;
		}
		validMemories.push(memory);
	}
	if (!validMemories.length) console.info("暂无记忆内容。");

	return buildGalleryImageData(
		validMemories,
		generateGalleryPositions(validMemories.length)
	);
})();

(function () {
	/* ==== definitions ==== */
	var diapo = [], layers = [], ctx, pointer, scr, camera, light, fps = 0, quality = [1,2],
		baseFocalLength = 0, zoom = 1, targetZoom = 1,
		captionTimer = null, captionVersion = 0, navigationIdleTimer = null,
	setMemoryHeadingVisible = function (visible) {
		var heading = document.getElementById("memoryHeading");
		if (!heading) return;
		if (visible) heading.classList.remove("memory-heading--hidden");
		else heading.classList.add("memory-heading--hidden");
	},
	hideMemoryCaption = function () {
		captionVersion++;
		if (captionTimer) {
			window.clearTimeout(captionTimer);
			captionTimer = null;
		}

		var caption = document.getElementById("memoryCaption");
		if (!caption) return;
		caption.classList.remove("memory-caption--visible");
		caption.setAttribute("aria-hidden", "true");
	},
	showMemoryCaption = function (diapo) {
		hideMemoryCaption();
		var requestedVersion = captionVersion;

		captionTimer = window.setTimeout(function () {
			captionTimer = null;
			if (requestedVersion !== captionVersion || camera.target.elem !== diapo) return;

			var caption = document.getElementById("memoryCaption");
			var meta = document.getElementById("memoryCaptionMeta");
			var date = document.getElementById("memoryDate");
			var location = document.getElementById("memoryLocation");
			var separator = document.getElementById("memoryCaptionSeparator");
			var title = document.getElementById("memoryCaptionTitle");
			var text = document.getElementById("memoryCaptionText");

			date.textContent = diapo.date;
			location.textContent = diapo.location;
			separator.style.display = diapo.date && diapo.location ? "inline-block" : "none";
			meta.style.display = diapo.date || diapo.location ? "block" : "none";
			title.textContent = diapo.title;
			title.style.display = diapo.title ? "block" : "none";
			text.textContent = diapo.text;
			text.style.display = diapo.text ? "block" : "none";

			caption.classList.add("memory-caption--visible");
			caption.setAttribute("aria-hidden", "false");
		}, 450);
	},
	clearGalleryNavigationIdle = function () {
		if (navigationIdleTimer) {
			window.clearTimeout(navigationIdleTimer);
			navigationIdleTimer = null;
		}
	},
	scheduleGalleryNavigationIdle = function () {
		clearGalleryNavigationIdle();
		var delay = window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse)").matches ? 1500 : 1000;

		navigationIdleTimer = window.setTimeout(function () {
			navigationIdleTimer = null;
			var navigation = document.getElementById("memoryNavigation");
			if (navigation && camera.target.elem) navigation.classList.add("memory-navigation--idle");
		}, delay);
	},
	wakeGalleryNavigation = function (restartIdleTimer) {
		clearGalleryNavigationIdle();
		var navigation = document.getElementById("memoryNavigation");
		if (!navigation || !camera.target.elem) return;
		navigation.classList.remove("memory-navigation--idle");
		if (restartIdleTimer !== false) scheduleGalleryNavigationIdle();
	},
	showGalleryNavigation = function () {
		var navigation = document.getElementById("memoryNavigation");
		if (!navigation || diapo.length <= 1) return;
		navigation.classList.add("memory-navigation--visible");
		navigation.setAttribute("aria-hidden", "false");
		wakeGalleryNavigation(true);
	},
	hideGalleryNavigation = function () {
		clearGalleryNavigationIdle();
		var navigation = document.getElementById("memoryNavigation");
		if (!navigation) return;
		navigation.classList.remove("memory-navigation--visible", "memory-navigation--idle");
		navigation.setAttribute("aria-hidden", "true");
	},
	focusMemory = function (targetDiapo) {
		if (!targetDiapo) return;

		hideMemoryCaption();
		camera.target.elem = targetDiapo;
		camera.target.x = targetDiapo.tx;
		camera.target.z = targetDiapo.tz;
		setMemoryHeadingVisible(false);
		showGalleryNavigation();
		showMemoryCaption(targetDiapo);

		// ---- adapt tesselation level to distance ----
		for (var i = 0, d; d = diapo[i++];) {
			var dx = camera.target.x - d.pc.x;
			var dz = camera.target.z - d.pc.z;
			var dist = Math.sqrt(dx * dx + dz * dz);
			var lev = (dist > 1500) ? quality[0] : quality[1];
			d.img.setLevel(lev);
		}
	},
	focusDiapoByIndex = function (index) {
		if (!diapo.length) return;
		index = (index + diapo.length) % diapo.length;
		focusMemory(diapo[index]);
	},
	goToPreviousMemory = function () {
		if (camera.target.elem && diapo.length > 1) focusDiapoByIndex(camera.target.elem.index - 1);
	},
	goToNextMemory = function () {
		if (camera.target.elem && diapo.length > 1) focusDiapoByIndex(camera.target.elem.index + 1);
	},
	returnToGallery = function () {
		hideMemoryCaption();
		hideGalleryNavigation();
		camera.target.x = 0;
		camera.target.z = 0;
		camera.target.elem = false;
		setMemoryHeadingVisible(true);
	},
	// ---- poly constructor ----
	Poly = function (parent, face) {
		this.parent = parent;
		this.ctx    = ctx;
		this.color  = face.fill || false;
		this.points = [];
		if (!face.img) {
			// ---- create points ----
			for (var i = 0; i < 4; i++) {
				this.points[i] = new ge1doot.transform3D.Point(
					parent.pc.x + (face.x[i] * parent.normalZ) + (face.z[i] * parent.normalX),
					parent.pc.y +  face.y[i],
					parent.pc.z + (face.x[i] * parent.normalX) + (-face.z[i] * parent.normalZ)
				);
			}
			this.points[3].next = false;
		}
	},
	// ---- diapo constructor ----
	Diapo = function (path, img, structure, index) {
		// ---- create image ----
		this.img = new ge1doot.transform3D.Image(
			this, path + img.img, 1, {
				isLoaded: function(img) {
					img.parent.isLoaded = true;
					img.parent.loaded(img);
				}
			}
		);
		this.visible  = false;
		this.normalX  = img.nx;
		this.normalZ  = img.nz;
		this.memory   = img.memory || {};
		this.title    = this.memory.title || "";
		this.date     = this.memory.date || "";
		this.location = this.memory.location || "";
		this.text     = this.memory.text || "";
		this.index    = index;
		// ---- point center ----
		this.pc = new ge1doot.transform3D.Point(img.x, img.y, img.z);
		// ---- target positions ----
		this.tx = img.x + (img.nx * Math.sqrt(camera.focalLength) * 26);
		this.tz = img.z - (img.nz * Math.sqrt(camera.focalLength) * 26);
		// ---- create polygons ----
		this.poly = [];
		for (var i = -1, p; p = structure[++i];) {
			layers[i] = (p.img === true ? 1 : 2);
			this.poly.push(
				new Poly(this, p)
			);
		}
	},
	// ---- init section ----
	init = function (json) {
		// draw poly primitive
		Poly.prototype.drawPoly = ge1doot.transform3D.drawPoly;
		// ---- init screen ----
		scr = new ge1doot.Screen({
			container: "canvas"
		});
		ctx = scr.ctx;
		scr.resize();
		// ---- init pointer ----
		pointer = new ge1doot.Pointer({
			tap: function () {
				if (camera.over) {
					if (camera.over === camera.target.elem) {
						// ---- return to the center ----
						returnToGallery();
					} else {
						// ---- goto diapo ----
						focusMemory(camera.over);
					}
				}
			},
			startDrag: function () {
				if (camera.target.elem) {
					hideMemoryCaption();
					hideGalleryNavigation();
					camera.target.elem = false;
					setMemoryHeadingVisible(true);
				}
			}
		});
		// ---- init camera ----
		baseFocalLength = Math.sqrt(scr.width) * 10;
		camera = new ge1doot.transform3D.Camera({
			focalLength: baseFocalLength,
			easeTranslation: 0.025,
			easeRotation: 0.06,
			disableRz: true
		}, {
			move: function () {
				this.over = false;
				// ---- smooth optical zoom: change field of view, never camera position ----
				zoom += (targetZoom - zoom) * 0.12;
				this.focalLength = baseFocalLength * zoom;
				// ---- rotation ----
				if (pointer.isDraging) {
					if (this.target.elem) {
						hideMemoryCaption();
						hideGalleryNavigation();
						setMemoryHeadingVisible(true);
					}
					this.target.elem = false;
					this.target.ry = -pointer.Xi * 0.01;
					this.target.rx = (pointer.Y - scr.height * 0.5) / (scr.height * 0.5);
				} else {
					if (this.target.elem) {
						this.target.ry = Math.atan2(
							this.target.elem.pc.x - this.x,
							this.target.elem.pc.z - this.z
						);
					}
				}
				this.target.rx *= 0.9;
			}
		});
		camera.z  = -10000;
		camera.py = 0;

		// ---- 鼠标滚轮缩放 ----
		// 使用焦距实现屏幕中心缩放，不移动相机，因此旋转视角后也不会横向漂移。
		scr.elem.addEventListener("wheel", function (e) {
			e.preventDefault();

			// 兼容鼠标滚轮、触控板以及不同浏览器的 deltaMode。
			var delta = e.deltaY;
			if (e.deltaMode === 1) delta *= 16;
			else if (e.deltaMode === 2) delta *= scr.height;

			// 乘法缩放使每一档的视觉变化保持一致，范围固定为 0.5×–3×。
			targetZoom *= Math.exp(-delta * 0.0015);
			targetZoom = Math.max(0.5, Math.min(3, targetZoom));
		}, { passive: false });

		// ---- 中键（滚轮按下）只重置缩放比例，保持当前朝向和位置 ----
		// 用捕获阶段 + stopPropagation，阻止中键事件传到 ge1doot 的 Pointer，
		// 否则 Pointer 会把中键当成左键拖动，导致 Xi/Yi 错乱、视角乱跑。
		scr.elem.addEventListener("mousedown", function (e) {
			if (e.button === 1) {
				// button === 1 是中键
				e.preventDefault();
				e.stopPropagation();
				targetZoom = 1;
			}
		}, true);
		// 阻止中键的默认"自动滚动"行为
		scr.elem.addEventListener("auxclick", function (e) {
			if (e.button === 1) e.preventDefault();
		}, { passive: false });

		// ---- 聚焦状态键盘导航 / ESC 返回展厅中央 ----
		document.addEventListener("keydown", function (e) {
			if (!camera.target.elem) return;
			if (e.key === "Escape" || e.keyCode === 27) {
				e.preventDefault();
				returnToGallery();
			} else if (e.key === "ArrowLeft" || e.keyCode === 37) {
				e.preventDefault();
				goToPreviousMemory();
			} else if (e.key === "ArrowRight" || e.keyCode === 39) {
				e.preventDefault();
				goToNextMemory();
			}
		}, false);

		// ---- create images ----
		for (var i = 0, img; img = json.imgdata[i++];) {
			diapo.push(
				new Diapo(
					json.options.imagesPath,
					img,
					json.structure,
					i - 1
				)
			);
		}

		// ---- focused gallery navigation controls ----
		var previousButton = document.getElementById("memoryPrev");
		var nextButton = document.getElementById("memoryNext");

		var stopNavigationPointer = function (e) {
			e.preventDefault();
			e.stopPropagation();
		};
		previousButton.addEventListener("mousedown", stopNavigationPointer, false);
		nextButton.addEventListener("mousedown", stopNavigationPointer, false);

		previousButton.addEventListener("click", function (e) {
			stopNavigationPointer(e);
			wakeGalleryNavigation(true);
			goToPreviousMemory();
		}, false);
		nextButton.addEventListener("click", function (e) {
			stopNavigationPointer(e);
			wakeGalleryNavigation(true);
			goToNextMemory();
		}, false);

		var bindNavigationAwakeState = function (button) {
			button.addEventListener("mouseenter", function () {
				wakeGalleryNavigation(false);
			}, false);
			button.addEventListener("mousemove", function () {
				wakeGalleryNavigation(false);
			}, false);
			button.addEventListener("mouseleave", function () {
				if (camera.target.elem) wakeGalleryNavigation(true);
			}, false);
			button.addEventListener("focus", function () {
				wakeGalleryNavigation(false);
			}, false);
			button.addEventListener("blur", function () {
				if (camera.target.elem) scheduleGalleryNavigationIdle();
			}, false);
		};
		bindNavigationAwakeState(previousButton);
		bindNavigationAwakeState(nextButton);
		// ---- start engine ---- >>>
		setInterval(function() {
			quality = (fps > 50) ? [2,3] : [1,2];
			fps = 0;
		}, 1000);
		run();
	},
	// ---- main loop ----
	run = function () {
		// ---- clear screen ----
		ctx.clearRect(0, 0, scr.width, scr.height);
		// ---- camera ----
		camera.move();
		// ---- draw layers ----
		for (var k = -1, l; l = layers[++k];) {
			light = false;
			for (var i = 0, d; d = diapo[i++];) {
				(l === 1 && d.draw()) ||
				(d.visible && d.poly[k].draw());
			}
		}
		// ---- cursor ----
		if (camera.over && !pointer.isDraging) {
			scr.setCursor("pointer");
		} else {
			scr.setCursor("move");
		}
		// ---- loop ----
		fps++;
		requestAnimFrame(run);
	};
	/* ==== prototypes ==== */
	Poly.prototype.draw = function () {
		// ---- color light ----
		var c = this.color;
		if (c.light || !light) {
			var s = c.light ? this.parent.light : 1;
			// ---- rgba color ----
			light = "rgba(" +
				Math.round(c.r * s) + "," +
				Math.round(c.g * s) + "," +
				Math.round(c.b * s) + "," + (c.a || 1) + ")";
			ctx.fillStyle = light;
		}
		// ---- paint poly ----
		if (!c.light || this.parent.light < 1) {
			// ---- projection ----
			for (
				var i = 0;
				this.points[i++].projection();
			);
			this.drawPoly();
			ctx.fill();
		}
	}
	/* ==== image onload ==== */
	Diapo.prototype.loaded = function (img) {
		// ---- create points ----
		var d = [-1,1,1,-1,1,1,-1,-1];

		// ---- 自适应缩放：保持原图比例，并放进更醒目的 920×690 展示区域 ----
		var maxWidth = 920;
		var maxHeight = 690;

		var scale = Math.min(
			maxWidth / img.texture.width,
			maxHeight / img.texture.height
		);

		var w = img.texture.width * scale * 0.5;
		var h = img.texture.height * scale * 0.5;

		for (var i = 0; i < 4; i++) {
			img.points[i] = new ge1doot.transform3D.Point(
				this.pc.x + (w * this.normalZ * d[i]),
				this.pc.y + (h * d[i + 4]),
				this.pc.z + (w * this.normalX * d[i])
			);
		}
	}
	/* ==== images draw ==== */
	Diapo.prototype.draw = function () {
		// ---- visibility ----
		this.pc.projection();
		if (this.pc.Z > -(camera.focalLength >> 1) && this.img.transform3D(true)) {
			// ---- light ----
			this.light = 0.5 + Math.abs(this.normalZ * camera.cosY - this.normalX * camera.sinY) * 0.6;
			// ---- draw image ----
			this.visible = true;
			this.img.draw();
			// ---- test pointer inside ----
			if (pointer.hasMoved || pointer.isDown) {
				if (
					this.img.isPointerInside(
						pointer.X,
						pointer.Y
					)
				) camera.over = this;
			}
		} else this.visible = false;
		return true;
	}
	return {
		// --- load data ----
		load : function (data) {
			window.addEventListener('load', function () {
				ge1doot.loadJS(
					"js/imageTransform3D.js",
					init, data
				);
			}, false);
		}
	}
})().load({
	imgdata: memoryImageData,
	structure:[
		{
			// wall
			fill: {r:255, g:255, b:255, light:1},
			x: [-1001,-490,-490,-1001],
			z: [-500,-500,-500,-500],
			y: [500,500,-500,-500]
		},{
			// wall
			fill: {r:255, g:255, b:255, light:1},
			x: [-501,2,2,-500],
			z: [-500,-500,-500,-500],
			y: [500,500,-500,-500]
		},{
			// wall
			fill: {r:255, g:255, b:255, light:1},
			x: [0,502,502,0],
			z: [-500,-500,-500,-500],
			y: [500,500,-500,-500]
		},{
			// wall
			fill: {r:255, g:255, b:255, light:1},
			x: [490,1002,1002,490],
			z: [-500,-500,-500,-500],
			y: [500,500,-500,-500]
		},{
			// shadow
			fill: {r:0, g:0, b:0, a:0.2},
			x: [-420,420,420,-420],
			z: [-500,-500,-500,-500],
			y: [150, 150,-320,-320]
		},{
			// shadow
			fill: {r:0, g:0, b:0, a:0.2},
			x: [-20,20,20,-20],
			z: [-500,-500,-500,-500],
			y: [250, 250,150,150]
		},{
			// shadow
			fill: {r:0, g:0, b:0, a:0.2},
			x: [-20,20,20,-20],
			z: [-500,-500,-500,-500],
			y: [-320, -320,-500,-500]
		},{
			// shadow
			fill: {r:0, g:0, b:0, a:0.2},
			x: [-20,20,10,-10],
			z: [-500,-500,-100,-100],
			y: [-500, -500,-500,-500]
		},{
			// base
			fill: {r:32, g:32, b:32},
			x: [-50,50,50,-50],
			z: [-150,-150,-50,-50],
			y: [-500,-500,-500,-500]
		},{
			// support
			fill: {r:16, g:16, b:16},
			x: [-10,10,10,-10],
			z: [-100,-100,-100,-100],
			y: [300,300,-500,-500]
		},{
			// frame
			fill: {r:255, g:255, b:255},
			x: [-320,-320,-320,-320],
			z: [0,-20,-20,0],
			y: [-190,-190,190,190]
		},{
			// frame
			fill: {r:255, g:255, b:255},
			x: [320,320,320,320],
			z: [0,-20,-20,0],
			y: [-190,-190,190,190]
		},
		{img:true},
		{
			// ceilingLight
			fill: {r:83, g:116, b:145},
			x: [-50,50,50,-50],
			z: [450,450,550,550],
			y: [500,500,500,500]
		},{
			// groundLight
			fill: {r:83, g:116, b:145},
			x: [-50,50,50,-50],
			z: [450,450,550,550],
			y: [-500,-500,-500,-500]
		}
	],
	options:{
		imagesPath: ""
	}
});
</script>

<script type="text/javascript">
(function () {
	"use strict";

	var titleText = "记 忆";
	var subtitleText = "一些值得留下的瞬间";

	function typeText(element, text, delay, done) {
		var index = 0;

		function typeNextCharacter() {
			if (index < text.length) {
				element.textContent += text.charAt(index++);
				window.setTimeout(typeNextCharacter, delay);
			} else if (done) {
				done();
			}
		}

		typeNextCharacter();
	}

	window.addEventListener("load", function () {
		var title = document.getElementById("memoryTitle");
		var subtitle = document.getElementById("memorySubtitle");
		var cursor = document.getElementById("memoryCursor");
		var subtitleLine = subtitle.parentNode;

		typeText(title, titleText, 180, function () {
			window.setTimeout(function () {
				subtitleLine.appendChild(cursor);
				typeText(subtitle, subtitleText, 95, function () {
					window.setTimeout(function () {
						cursor.className += " memory-heading__cursor--hidden";
					}, 1600);
				});
			}, 650);
		});
	}, false);
})();
</script>
