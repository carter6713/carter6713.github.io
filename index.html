<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carter's Homepage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #1e1e1e;
            color: white;

            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 20px;
        }

        p {
            font-size: 22px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        a {
            display: inline-block;
            padding: 12px 24px;

            color: white;
            text-decoration: none;

            border: 1px solid white;
            border-radius: 8px;

            transition: 0.3s;
        }

        a:hover {
            background: white;
            color: black;
        }
    </style>
</head>
